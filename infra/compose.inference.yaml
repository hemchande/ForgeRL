# Optional GPU inference service. Requires Docker Compose GPU support and NVIDIA drivers.
# Rollout workers run as host processes, NOT inside a container with a mounted Docker socket.
services:
  inference:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - ${FORGERL_MODEL:-Qwen/Qwen2.5-Coder-1.5B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "4096"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    gpus: all
    ipc: host
volumes:
  hf-cache:
